[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-table-retrieval"
version = "0.1.0"
description = "Two-stage scientific table and evidence-cell retrieval"
readme = "table_retrieval/README.md"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "numpy>=1.26,<2",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "tqdm>=4.70,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["table_retrieval*"]
exclude = [
  "table_retrieval.experiments*",
  "table_retrieval.evaluation.tests*",
  "table_retrieval.tests*",
]
namespaces = true

[tool.setuptools.package-data]
table_retrieval = ["config.json", "evaluation/settings.json"]
