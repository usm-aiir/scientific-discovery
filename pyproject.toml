[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-table-retrieval"
version = "0.1.0"
description = "Two-stage scientific table and evidence-cell retrieval"
readme = "table_retrieval/README.md"
requires-python = ">=3.10"
# Library versions live only in requirements.txt; setup.sh installs them first.

[tool.setuptools.packages.find]
where = ["."]
include = [
  "table_retrieval",
  "table_retrieval.live*",
  "table_retrieval.experiments",
  "table_retrieval.experiments.stage1*",
  "table_retrieval.experiments.stage2_bge*",
]
exclude = [
  "table_retrieval.live.*tests*",
  "table_retrieval.experiments.*.tests*",
  "table_retrieval.experiments.tests*",
  "table_retrieval.tests*",
]
namespaces = true

[tool.setuptools.package-data]
table_retrieval = ["config.example.json"]
"table_retrieval.experiments.stage2_bge" = ["config.json"]
