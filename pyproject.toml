[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-table-retrieval"
version = "0.1.0"
description = "Two-stage scientific table and evidence-cell retrieval"
readme = "table_retrieval/README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "tqdm>=4.70,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["table_retrieval*"]
exclude = [
  "table_retrieval.demo*",
  "table_retrieval.experiments*",
  "table_retrieval.tests*",
  "table_retrieval.stage2.bge.data*",
  "table_retrieval.stage2.tests*",
  "table_retrieval.stage2.training*",
  "table_retrieval.stage2.synthetic*",
]
namespaces = true

[tool.setuptools.package-data]
table_retrieval = ["settings.json", "stage2/reviewed_layouts.json"]
